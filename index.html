<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>🎁 GifDex — Новогодние Подарки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">
  <!-- Снег -->
  <div id="snow-container"></div>
  <script>
    const snowContainer = document.getElementById("snow-container");
    for (let i = 0; i < 60; i++) {
      const flake = document.createElement("div");
      flake.className = "snowflake";
      flake.style.left = Math.random() * 100 + "vw";
      flake.style.opacity = Math.random() * 0.5 + 0.3;
      flake.style.width = Math.random() * 10 + 5 + "px";
      flake.style.height = flake.style.width;
      flake.style.animationDuration = Math.random() * 5 + 5 + "s";
      flake.style.animationDelay = Math.random() * 5 + "s";
      snowContainer.appendChild(flake);
    }
  </script>

  <!-- Новогодний баннер -->
  <div class="marquee-banner">
    <span>✨ С НОВЫМ ГОДОМ! ПОДАРКИ ДЛЯ ВСЕХ! ✨ С НОВЫМ ГОДОМ! ПОДАРКИ ДЛЯ ВСЕХ! ✨</span>
  </div>

  <div class="app-container">
    <div class="nav-tabs">
      <div class="nav-tab active" data-view="gifts">
        <div class="icon">🎁</div>
        <div>Магазин</div>
      </div>
      <div class="nav-tab" data-view="cases">
        <div class="icon">🎄</div>
        <div>Кейсы</div>
      </div>
      <div class="nav-tab" data-view="mining">
        <div class="icon">⛏️</div>
        <div>Майнинг</div>
      </div>
      <div class="nav-tab" data-view="profile">
        <div class="icon">👤</div>
        <div>Профиль</div>
      </div>
    </div>

    <main class="main-content" id="main-content">
      <div style="padding: 20px; text-align: center; color: #aaa;">Загрузка...</div>
    </main>
  </div>

  <!-- Модалка кейса -->
  <div id="case-modal" class="modal hidden">
    <div class="modal-content">
      <div class="case-animation">
        <div class="case-box">🎁</div>
        <div class="sparkle">✨</div>
        <div class="sparkle">✨</div>
        <div class="sparkle">✨</div>
      </div>
      <div class="case-result" id="case-result"></div>
      <button class="buy-btn" id="close-case-modal">Закрыть</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
